# 3️⃣ Load Balancing

# RabbitMQ automatically balances messages across consumers.

# Example: 3 instances of Service B consuming from a queue → messages are split among them.

# If one instance goes down, others continue processing → fault tolerance.

# ✅ Summary

# Decoupled: Services communicate via RabbitMQ, not direct calls.

# Scalable: Add more instances to consume messages in parallel.

# Load balanced: RabbitMQ evenly distributes messages to available consumers.

